# Move this file to .github/workflows/pages.yml to publish on GitHub Pages.
# Then in the repo: Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  release:
    types: [published]
  repository_dispatch:
    types: [staged-release]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The site is served from /<repo-name>/ on github.io. Remove this line if you use a custom domain.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
